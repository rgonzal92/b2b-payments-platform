# Local development stack. Spring Boot's Docker Compose support starts it with either app.
services:
  postgres:
    # Same tag as the platform's TestcontainersConfiguration: change both together.
    image: postgres:18.6
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments # local-only credential
    ports:
      - "5432:5432"

  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP over gRPC
      - "4318:4318" # OTLP over HTTP
