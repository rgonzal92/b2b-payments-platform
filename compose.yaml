# Local development stack. Spring Boot's Docker Compose support starts it with either app.
# Every port listens on 127.0.0.1 only: the database takes no password and Grafana no login.
services:
  postgres:
    # Same tag as the platform's TestcontainersConfiguration and e2e's CorePathEndToEndTests: change all three.
    image: postgres:18.6
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"

  # authorization-service's own database (M5), on its own port: a batch job in the platform can't take its
  # connections or I/O. The platform's Docker Compose support starts it with the stack but ignores it, so it
  # still finds one PostgreSQL; the service connects by the address in its application.properties.
  authorization-postgres:
    # Same tag as authorization-service's TestcontainersConfiguration: change both together.
    image: postgres:18.6
    environment:
      POSTGRES_DB: authorization
      POSTGRES_USER: authorization
      POSTGRES_HOST_AUTH_METHOD: trust
    labels:
      org.springframework.boot.ignore: "true"
    ports:
      - "127.0.0.1:5433:5432"

  # vault-service's own database (M7): the Card Vault's cards, outside the platform's PCI scope. Ignored by the
  # platform's Docker Compose support, as authorization-postgres is.
  vault-postgres:
    # Same tag as vault-service's TestcontainersConfiguration: change both together.
    image: postgres:18.6
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_HOST_AUTH_METHOD: trust
    labels:
      org.springframework.boot.ignore: "true"
    ports:
      - "127.0.0.1:5434:5432"

  # OpenBao (M7) in dev mode, for vault-service's key-encryption key: everything lives in memory, so restarting the
  # container loses the key and every card issued into vault-service with it (docs/learning/openbao.md). On every start
  # it runs openbao/dev-init.hcl: Transit with the key card-kek, and vault-service's token under its own policy.
  openbao:
    # Same image as vault-service's TestcontainersConfiguration: change both together.
    image: openbao/openbao:2.7.2
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN:?run scripts/init-env.sh first}
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:?run scripts/init-env.sh first}
      # The config folder is mounted read-only, so the entrypoint mustn't chown it.
      SKIP_CHOWN: "true"
    volumes:
      - ./openbao:/openbao/config:ro
    labels:
      org.springframework.boot.ignore: "true"
    ports:
      - "127.0.0.1:8200:8200"

  kafka:
    # Same image as the platform's TestKafka: change both together. One broker, KRaft, with the
    # listeners Testcontainers' KafkaContainer uses; the platform reaches PLAINTEXT on 9092.
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,BROKER://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,BROKER://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:9092"

  lgtm:
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "127.0.0.1:3000:3000" # Grafana
      - "127.0.0.1:4317:4317" # OTLP over gRPC
      - "127.0.0.1:4318:4318" # OTLP over HTTP
    # Dashboards and the alert rule as code (docs/learning/grafana-provisioning.md). Each provisioning file is
    # mounted on its own, so the image's own providers and data sources stay.
    volumes:
      - ./grafana/dashboards:/otel-lgtm/b2b-payments-dashboards:ro
      - ./grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/b2b-payments.yaml:ro
      - ./grafana/provisioning/alerting.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/b2b-payments.yaml:ro

  # The Gateway's rate limiter (M6). The Gateway connects by Spring Boot's default address, localhost:6379; the
  # platform's Docker Compose support starts it with the stack and ignores it, having no Redis client.
  redis:
    # Same image as the Gateway's GatewayTests and the chart's infra values: change all three.
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:6379:6379"

  keycloak:
    # Same image as the platform's TestKeycloak and e2e's CorePathEndToEndTests: change all three.
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/init-env.sh first}
      # The realm file reads client secrets from these placeholders at import.
      SIMULATOR_ISSUER_ADMIN_SECRET: ${SIMULATOR_ISSUER_ADMIN_SECRET:?run scripts/init-env.sh first}
      SIMULATOR_RECONCILER_SECRET: ${SIMULATOR_RECONCILER_SECRET:?run scripts/init-env.sh first}
      ACME_ERP_SECRET: ${ACME_ERP_SECRET:?run scripts/init-env.sh first}
      ACME_APPROVER_1_SECRET: ${ACME_APPROVER_1_SECRET:?run scripts/init-env.sh first}
      ACME_APPROVER_2_SECRET: ${ACME_APPROVER_2_SECRET:?run scripts/init-env.sh first}
      INITECH_ERP_SECRET: ${INITECH_ERP_SECRET:?run scripts/init-env.sh first}
      INITECH_APPROVER_SECRET: ${INITECH_APPROVER_SECRET:?run scripts/init-env.sh first}
      NETWORK_CLIENT_SECRET: ${NETWORK_CLIENT_SECRET:?run scripts/init-env.sh first}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8180:8080"
