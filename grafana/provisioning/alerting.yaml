# Grafana reads this at startup from /otel-lgtm/grafana/conf/provisioning/alerting/ (docs/learning/grafana-provisioning.md).
# Four rules: ADR-0010's target, authorization-service's Authorize p99 above 100 ms for 5 minutes; a Payment waiting
# more than 5 minutes for its card to be on file (M5 design, "The gaps"); and authorization-service or the platform
# exporting nothing for 5 minutes, which the other rules can't tell from an idle system. No contact point is set up
# locally, so they only show as firing in Grafana (Alerting > Alert rules).
apiVersion: 1

groups:
  - orgId: 1
    name: authorization
    folder: B2B Payments
    interval: 1m
    rules:
      - uid: authorization-p99
        title: Authorization p99 above 100 ms
        condition: C
        for: 5m
        # No Authorize calls means nothing to measure, not a breach, as when the Network is idle; a query that fails is
        # shown as an error.
        noDataState: OK
        execErrState: Error
        dashboardUid: authorization
        panelId: 2
        annotations:
          summary: Authorize's server-side p99 has stayed above 100 ms for 5 minutes (ADR-0010).
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: histogram_quantile(0.99, sum by (le) (rate(grpc_server_milliseconds_bucket{job="authorization-service", rpc_method="Authorize"}[5m])))
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 100

  - orgId: 1
    name: payables
    folder: B2B Payments
    interval: 1m
    rules:
      - uid: payment-waiting-card-on-file
        title: Payment waiting more than 5 minutes for its card to be on file
        condition: C
        # The gauge is the oldest wait itself, so the first evaluation above 5 minutes fires.
        for: 0s
        # No data means the platform isn't exporting; nothing waits that this rule can see.
        noDataState: OK
        execErrState: Error
        dashboardUid: payments
        panelId: 6
        annotations:
          summary: >-
            A Payment has waited more than 5 minutes for authorization-service to have its card on file: check the
            consumer lag on the cards and authorizations topics, and the service's outbox. Runbook:
            docs/runbooks/payment-stuck.md#a-payment-stays-card_issued-its-card-isnt-on-file
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: max(payments_waiting_card_on_file_oldest_seconds{job="platform"})
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 300

  # Every metrics export (once a minute) refreshes the app's target_info series, its OTLP resource, so 5 minutes
  # without one means the app is down or can't reach otel-lgtm. otel-lgtm's Prometheus receives pushes and scrapes no
  # app, so there is no up series to read.
  - orgId: 1
    name: apps
    folder: B2B Payments
    interval: 1m
    rules:
      - uid: authorization-service-not-exporting
        title: authorization-service exporting nothing for 5 minutes
        condition: C
        # The query is empty while the app exports, which is no data: nothing is absent.
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: >-
            authorization-service has sent no metrics for 5 minutes: it is down or can't reach otel-lgtm, and the Network's Charges get no answer. Runbook: docs/runbooks/authorization-service-database-down.md (if the service itself is down, start it).
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: absent_over_time(target_info{job="authorization-service"}[5m])
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: platform-not-exporting
        title: platform exporting nothing for 5 minutes
        condition: C
        # The query is empty while the app exports, which is no data: nothing is absent.
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: >-
            The platform has sent no metrics for 5 minutes: it is down or can't reach otel-lgtm, so Payments stall and its Authorization Copy falls behind. Runbook: docs/runbooks/payment-stuck.md#restarting-the-platform-is-safe
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: absent_over_time(target_info{job="platform"}[5m])
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
