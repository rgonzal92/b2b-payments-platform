httpPort: 8080
memory: 1536Mi
secret: platform-secrets
# The Clearing drop folder, shared with the simulator's Network: a file is claimed by an atomic move inside it.
hostFolders:
  - var/clearing
service:
  ports:
    - name: http
      port: 8080
      targetPort: http
# Every address the platform connects to (docs/architecture.md, Runtime): what Docker Compose supplies in development
# and what application.properties points at localhost.
env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
  SPRING_DATASOURCE_USERNAME: payments
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/traces
  MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/logs
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://lgtm:4318/v1/metrics
  # Tokens name http://localhost:8180 as their issuer, which pods can't reach: the keys come from Keycloak's Service.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/payments/protocol/openid-connect/certs
  # Remittance Advice links point through the Gateway, where Globex opens them from the simulator's pod.
  PLATFORM_PUBLIC_URL: http://gateway:8080
  CLEARING_DROP_FOLDER: "{{ .Values.global.repoRoot }}/var/clearing"
