# Two, so one can always be replaced while the other answers (M6 design, Two copies of each app).
replicas: 2
httpPort: 8083
# The way in: on 127.0.0.1:8080 of the host (scripts/k3d-cluster.sh), the address clients use in development, and on
# gateway:8080 inside the cluster.
service:
  type: LoadBalancer
  ports:
    - name: http
      port: 8080
      targetPort: http
env:
  GATEWAY_PLATFORM_URI: http://platform:8080
  # Tokens name http://localhost:8180 as their issuer, which pods can't reach: the keys come from Keycloak's Service.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/payments/protocol/openid-connect/certs
  # The rate limiter's token buckets.
  SPRING_DATA_REDIS_HOST: redis
  # Its metrics, the rate limiter's Redis-down counter among them.
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://lgtm:4318/v1/metrics
