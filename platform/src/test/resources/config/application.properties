# Loaded in addition to src/main/resources/application.properties (Spring Boot reads classpath:/config/
# after classpath:/ and lets it override), so tests keep the main settings and add only these.

# TEST-ONLY vault keys, not secrets: every byte is 0x01 (encryption) or 0x02 (hash), so nothing they
# protect is safe. The platform's real keys come from .env, written by scripts/init-env.sh.
vault.encryption-key=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
vault.hash-key=AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=

# TEST-ONLY Remittance Advice link key, not a secret: every byte is 0x03. The real one comes from .env.
remittance.link-key=AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=

# No test context checks a drop folder on its own: a test that imports Clearing Files sets its own folder and imports
# by hand, and no context reaches for the repository's var/clearing, where a developer's own files may wait.
clearing.drop-folder-check.enabled=false

# No test context reconciles on its own: a test that reconciles runs it by hand.
reconciliation.daily-run.enabled=false

# No test context sends events to Kafka on its own: the card events test imports a Kafka container
# and turns externalization on.
spring.modulith.events.externalization.enabled=false

# No test context reads the authorizations topic on its own, so none reaches for a broker it doesn't have: a test that
# imports a Kafka container and reads it turns its listeners on.
spring.kafka.listener.auto-startup=false

# No test context resubmits incomplete event publications on its own: the test of a send that failed runs the pass by
# hand.
platform.event-resubmission.enabled=false
