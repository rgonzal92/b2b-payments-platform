# Loaded in addition to src/main/resources/application.properties (Spring Boot reads classpath:/config/
# after classpath:/ and lets it override), so tests keep the main settings and add only these.

# TEST-ONLY vault keys, not secrets: every byte is 0x01 (encryption) or 0x02 (hash), so nothing they
# protect is safe. The platform's real keys come from .env, written by scripts/init-env.sh.
vault.encryption-key=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
vault.hash-key=AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=

# TEST-ONLY Remittance Advice link key, not a secret: every byte is 0x03. The real one comes from .env.
remittance.link-key=AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=

# Each test context's gRPC server takes a free port: cached contexts, and other builds on the same
# machine, would otherwise all reach for 9090. Tests read it with @LocalGrpcServerPort.
spring.grpc.server.port=0
