spring.application.name=platform
spring.threads.virtual.enabled=true

# Development secrets, written by scripts/init-env.sh.
spring.config.import=optional:file:../.env[.properties]

# The vault's keys (ADR-0004): 256 bits each, base64-encoded, one to encrypt card data and one to hash
# PANs. The platform refuses to start without them.
vault.encryption-key=${VAULT_ENCRYPTION_KEY:}
vault.hash-key=${VAULT_HASH_KEY:}

# Each Remittance Advice's link token is an HMAC of its Payment's ID under this key (suppliers): 256 bits,
# base64-encoded. The platform refuses to start without it.
remittance.link-key=${REMITTANCE_LINK_KEY:}
# The platform's address as Suppliers reach it: Remittance Advice links point under it.
platform.public-url=http://localhost:8080

# HTTP clients built from Spring Boot's RestClient.Builder; in the platform, only Remittance Advice delivery.
# The Payment saga's worker waits for the Supplier's answer, so one that doesn't answer fails the attempt
# quickly, and the saga retries it.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s
# A redirect is not a Supplier receiving the advice: the attempt fails instead of following it elsewhere.
spring.http.clients.redirects=dont-follow

# Both apps share one stack: start it if it isn't running, and leave it running on shutdown.
# The path is relative to the module directory, where spring-boot:run starts the app.
spring.docker.compose.file=../compose.yaml
spring.docker.compose.lifecycle-management=start-only

management.tracing.sampling.probability=1.0

# Each module runs its own Flyway, in its own schema (ADR-0009, ModuleMigrations).
spring.flyway.enabled=false

# Spring Modulith's event publication registry (ADR-0008) creates its table at startup, in a schema
# of its own. Creation is on by default although the property's metadata says otherwise.
spring.modulith.events.jdbc.schema=modulith
spring.modulith.events.jdbc.schema-initialization.enabled=true
# Publications whose listener didn't complete (the platform stopped, or the listener failed) are
# delivered again at startup; off by default. Listeners must therefore cope with an event twice.
spring.modulith.events.republish-outstanding-events-on-restart=true

# The Payment saga's worker (payables) claims due Payments every second. Tests that drive the worker
# by hand turn it off.
payables.payment-worker.enabled=true
# The card expiry job (cards) expires uncharged Single-Use Cards past their expiry every minute, and
# payables releases their Holds. Tests that run the job by hand turn it off.
cards.expiry-job.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/payments
# Keycloak puts realm roles in a flat "roles" claim (see keycloak/payments-realm.json).
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_

spring.mvc.problemdetails.enabled=true
