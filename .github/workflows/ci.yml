name: CI

# Each push starts one run: on its pull request, or on main.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels the run it supersedes. A run on main gets a group of its
# own, so it is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# The job ids are the check names the main ruleset requires by name: keep `build` and `secrets`.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The runner is thrown away after the run, so Testcontainers' clean-up container isn't needed.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube Cloud reads the history to tell new code from old.
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          # The newest Java 25: setup-java takes Corretto by major version only.
          java-version: '25'
          cache: maven
      - name: Verify
        run: ./mvnw -B verify
      # Each module's consumer tests rewrite its pacts in pacts/ during Verify. authorization-service builds before the
      # platform, so it verifies the platform's pact as committed: a rewritten pact that differs means the committed one
      # is stale, and the run fails until it is committed (docs/learning/pact.md).
      - name: Check the committed pacts are current
        run: |
          if [ -n "$(git status --porcelain -- pacts)" ]; then
            git status --porcelain -- pacts
            git diff -- pacts
            exit 1
          fi
      - name: Analyze with SonarQube Cloud
        # Pull requests from forks and from Dependabot receive no secrets, so they skip the analysis.
        # Dependabot's changes are analysed once merged, on the push to main.
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.login != 'dependabot[bot]')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Fails the job when the quality gate fails.
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true

  # The whole stack on a k3d cluster, as the README's "Run it on Kubernetes": the Network's Charges at 50 a second for
  # 60 seconds while authorization-service rolls; any failed call fails the job (M6 design, Proving it).
  k3d:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Update each pair together, from the release's checksums.
      K3D_VERSION: 5.8.3
      K3D_SHA256: dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e
      HELM_VERSION: 4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      # kubectl comes with the runner.
      - name: Install k3d and Helm
        run: |
          curl -sSfL -o "$RUNNER_TEMP/k3d" \
            "https://github.com/k3d-io/k3d/releases/download/v${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  $RUNNER_TEMP/k3d" | sha256sum -c -
          tarball="$RUNNER_TEMP/helm.tar.gz"
          curl -sSfL -o "$tarball" "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" --strip-components=1 linux-amd64/helm
          chmod +x "$RUNNER_TEMP/k3d"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # package first: on a clean checkout, build-image alone leaves contracts unpackaged for the apps that need it.
      - name: Build the images
        run: ./mvnw -B -pl platform,authorization-service,simulator,gateway -am -DskipTests package spring-boot:build-image
      - name: Create the cluster
        id: cluster
        run: ./scripts/k3d-cluster.sh
      # Throwaway secrets, generated on the runner and never printed.
      - name: Create the Secrets
        run: |
          ./scripts/init-env.sh
          ./scripts/k8s-secrets.sh
      - name: Install the chart
        run: |
          helm upgrade --install b2b-payments deploy/helm/b2b-payments -f deploy/helm/b2b-payments/load-test-values.yaml \
            --set global.hostUser.uid="$(id -u)" --set global.hostUser.gid="$(id -g)"
          kubectl wait --for=condition=Available deployment --all --timeout=600s
      - name: Load test through a redeploy
        run: ./scripts/k8s-load-test.sh
      - name: Show the pods
        if: failure() && steps.cluster.outcome == 'success'
        run: |
          kubectl get pods -o wide
          kubectl get events --sort-by=.lastTimestamp | tail -50

  secrets:
    runs-on: ubuntu-latest
    env:
      # Update both together, from the release's checksums file.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action scans only the commits in a push or pull request; the CLI scans everything.
      - name: Install gitleaks
        run: |
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'
