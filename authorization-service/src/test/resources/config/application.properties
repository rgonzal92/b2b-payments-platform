# Loaded in addition to src/main/resources/application.properties (Spring Boot reads classpath:/config/
# after classpath:/ and lets it override), so tests keep the main settings and add only these.

# TEST-ONLY hash key, not a secret: every byte is 0x02, the same test key as the platform's tests. The real
# one comes from .env, written by scripts/init-env.sh.
vault.hash-key=AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=

# Each test context's gRPC server takes a free port: cached contexts, and a running service, would otherwise all reach
# for 9090. Tests read it with @LocalGrpcServerPort.
spring.grpc.server.port=0
