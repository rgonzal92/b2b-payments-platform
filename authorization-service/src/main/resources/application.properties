spring.application.name=authorization-service

# Development secrets, written by scripts/init-env.sh.
spring.config.import=optional:file:../.env[.properties]

# The platform's vault hash key (ADR-0004, as amended by ADR-0016): the service hashes each request's PAN and
# security code under it to compare with the hashes in its copy of the cards. Its own environment gives it; the
# service refuses to start without it and never logs it.
vault.hash-key=${VAULT_HASH_KEY:}

# The platform has 8080 and the simulator 8081.
server.port=8082

# The Network link: Spring gRPC's Netty server beside WebFlux, on this machine only, plaintext until M7. On 9090, where
# the platform answered until M5, so the simulator's Network and the load test call it unchanged. Every call needs the
# Network's Keycloak token (SecurityConfig). The cluster binds every interface (SPRING_GRPC_SERVER_ADDRESS=0.0.0.0).
spring.grpc.server.address=127.0.0.1
spring.grpc.server.port=9090

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/payments
# Unset here, so the signing keys come from the issuer's discovery document. Where the issuer's address isn't reachable
# (the cluster), SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI names the keys' address instead; iss is still
# checked against issuer-uri, which is then never fetched (SecurityConfig).
# Keycloak puts realm roles in a flat "roles" claim (see keycloak/payments-realm.json).
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_

# Metrics, traces and logs go to otel-lgtm over OTLP, under service.name authorization-service, the application name.
# The platform finds otel-lgtm through its Docker Compose support, which the service doesn't have: metrics go to
# localhost:4318 by default, and traces and logs need their endpoints set. Every trace is kept, as in the platform.
# Each address in this file has an environment variable that overrides it: SPRING_GRPC_SERVER_ADDRESS,
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT, MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT,
# SPRING_R2DBC_URL, SPRING_FLYWAY_URL and SPRING_KAFKA_BOOTSTRAP_SERVERS. The metrics endpoint, Spring Boot's default
# and not set here, is overridden by MANAGEMENT_OTLP_METRICS_EXPORT_URL.
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.tracing.sampling.probability=1.0
# Reactor hands the current trace from thread to thread, so the outbox row written on R2DBC's event loop records the
# trace of the Network's call (Outbox).
spring.reactor.context-propagation=auto
# Spring Kafka's observation: each message the relay sends carries its trace context in a traceparent header, and the
# cards topic's listener continues the platform's trace from its message's header.
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# The Network link's server timing (Spring gRPC's grpc.server observation) as a histogram, under the name the
# platform used until #92, so Grafana can compute p50/p95/p99 for Authorize; the 100ms boundary is the ADR-0010 target.
management.metrics.distribution.percentiles-histogram.grpc.server=true
management.metrics.distribution.slo.grpc.server=100ms

# The service's own PostgreSQL, authorization-postgres in compose.yaml. Start the stack first: the platform or
# the simulator starts it, or docker compose up -d.
spring.r2dbc.url=r2dbc:postgresql://localhost:5433/authorization
spring.r2dbc.username=authorization
# Flyway migrates over its own JDBC connection: R2DBC has no Flyway support.
spring.flyway.url=jdbc:postgresql://localhost:5433/authorization
spring.flyway.user=authorization

# The platform's cards topic. A new consumer group reads it from the start, within Kafka's 7-day retention.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=authorization-service
spring.kafka.consumer.auto-offset-reset=earliest

# The service's only producer is the outbox relay (#90). It sends one message at a time and waits for Kafka's
# acknowledgement before the next, so a card's events reach the authorizations topic in order. Kafka 4's producer would
# otherwise wait 5 ms (linger.ms) for more messages to batch with each one, which no message here ever gets.
spring.kafka.producer.properties.linger.ms=0
# Each relay pass holds a pooled R2DBC connection and its transaction while it sends, so a send to an unreachable Kafka
# fails within seconds (instead of 60 s waiting for metadata and 2 minutes delivering) and ends the pass, freeing the
# connection; the next pass tries again. delivery.timeout.ms must be at least request.timeout.ms plus linger.ms.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=4000
spring.kafka.producer.properties.delivery.timeout.ms=5000

# The hot path's guard on its database (#93, Resilience4j). An Authorization not answered within the time limit gets
# 91 (Issuer unavailable), well inside the Network's 1 s deadline, so the Network never times out and sends a
# Reversal. The breaker opens when half of the last 20 Authorizations failed or timed out (counted from the 10th), then
# answers 91 at once without touching the database; after 5 s it lets 3 through, and closes if they succeed. A Reversal
# gets the same time limit, but no breaker.
resilience4j.timelimiter.instances.authorization-database.timeout-duration=500ms
resilience4j.circuitbreaker.instances.authorization-database.sliding-window-type=count_based
resilience4j.circuitbreaker.instances.authorization-database.sliding-window-size=20
resilience4j.circuitbreaker.instances.authorization-database.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.authorization-database.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authorization-database.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.authorization-database.permitted-number-of-calls-in-half-open-state=3
# A call waits at most this long for a pooled connection, then fails, instead of queuing past its time limit.
spring.r2dbc.pool.max-acquire-time=250ms
# After a 91 that reached the database, the service reverses the Authorization itself, in case its commit went through:
# retried with a pause doubling from the first backoff up to the max while the database is down, and given up, logged
# at ERROR, after the last setting.
authorization.self-reversal.first-backoff=100ms
authorization.self-reversal.max-backoff=5s
authorization.self-reversal.give-up-after=10m
