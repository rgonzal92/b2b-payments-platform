openapi: 3.0.3
info:
  title: B2B Payments Platform API
  version: v1
  description: The Issuer's platform API. Terms follow GLOSSARY.md; errors are RFC 9457 problem details.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/buyers/{buyerId}:
    put:
      tags: [Buyers]
      operationId: putBuyer
      summary: Create a Buyer
      description: >-
        Issuer staff only (role `issuer-admin`). The caller chooses the Buyer ID, so the same ID can be
        provisioned into Buyer-side tokens ahead of time. Repeating the same request is safe; a different
        Buyer under an existing ID is a conflict.
      parameters:
        - name: buyerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerRequest'
      responses:
        '200':
          description: The same Buyer already existed; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Buyer'
        '201':
          description: The Buyer was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Buyer'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/buyers/{buyerId}/credit-line:
    put:
      tags: [Credit]
      operationId: putCreditLine
      summary: Set a Buyer's Credit Line
      description: >-
        Issuer staff only (role `issuer-admin`). Sets the most the Buyer may owe the Issuer at once,
        replacing any Credit Line it already has.
      parameters:
        - name: buyerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Money'
      responses:
        '200':
          description: The Buyer's Credit Line was replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Money'
        '201':
          description: The Buyer had no Credit Line; now it has this one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Money'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/buyers/{buyerId}/credit:
    get:
      tags: [Credit]
      operationId: getCredit
      summary: Read a Buyer's Credit Line and Available Credit
      description: >-
        Issuer staff only (role `issuer-admin`). A Buyer whose Credit Line was never set answers `404`,
        like an unknown Buyer.
      parameters:
        - name: buyerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The Buyer's Credit Line and Available Credit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credit'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/invoices:
    post:
      tags: [Invoices]
      operationId: submitInvoice
      summary: Submit an Invoice
      description: >-
        A Buyer's ERP only (role `erp`); the Buyer is the one in the token's `buyer_id` claim. The amount must
        be more than zero. The first Invoice naming an unknown tax ID creates the Supplier, and the Buyer's first
        Invoice to a Supplier creates its Supplier Relationship; later Invoices reuse both and don't change them.
        Repeating a request with the same `Idempotency-Key` returns the original response; reusing a key with a
        different request is `422`. The same Supplier and Invoice number under a new key is `409`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A new random value per Invoice, such as a UUID; resend the same value when retrying.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      responses:
        '201':
          description: The Invoice was received, or this is the replay of an earlier response to the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoiceId}:
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Get an Invoice
      description: >-
        Buyer-side roles (`erp`, `approver`). An Invoice of any other Buyer answers `404`, as if it didn't exist.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The Invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoiceId}/approval:
    post:
      tags: [Invoices]
      operationId: approveInvoice
      summary: Approve an Invoice
      description: >-
        An Approver of the Invoice's Buyer only (role `approver`); the Approver is the token's subject. An Invoice at
        or under the Buyer's Approval Threshold is approved by one Approver; above it, by two different Approvers.
        The same Approver approving again changes nothing and returns the Invoice, so retrying is safe. A rejected
        Invoice, or one other Approvers have already fully approved, is `409`. An Invoice of any other Buyer
        answers `404`.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The Invoice, with this approval recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoiceId}/rejection:
    post:
      tags: [Invoices]
      operationId: rejectInvoice
      summary: Reject an Invoice
      description: >-
        An Approver of the Invoice's Buyer only (role `approver`); the Approver is the token's subject. An Approver
        may reject an Invoice they approved while it still awaits a second approval. A rejection is final: any later
        approval or rejection, the same Approver's included, is `409`. An approved Invoice can't be rejected
        (`409`). An Invoice of any other Buyer answers `404`.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The Invoice, rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/remittance-links/{token}:
    get:
      tags: [RemittanceLinks]
      operationId: openRemittanceLink
      summary: Open the card link of a Remittance Advice
      description: >-
        No sign-in: the token, sent to the Supplier in its Remittance Advice (`cardLink`), is the credential. The first
        open answers with the Single-Use Card's details and uses the link up. A later open, an open after the link
        expired (7 days after the Remittance Advice was created) or after the card was cancelled answers `410`; a token
        that matches no link answers `404`.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The card's details, shown this once.
          headers:
            Cache-Control:
              description: Always `no-store`, so no cache keeps the card's details.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleUseCardDetails'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: object
      description: An amount in integer minor units (cents for USD) with its currency.
      required: [minorUnits, currency]
      properties:
        minorUnits:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [USD]
    SignedMoney:
      type: object
      description: >-
        Like Money, but the amount may be negative, as Available Credit is when Issuer staff lower a Credit Line
        below the Buyer's open Holds.
      required: [minorUnits, currency]
      properties:
        minorUnits:
          type: integer
          format: int64
        currency:
          type: string
          enum: [USD]
    BuyerRequest:
      type: object
      required: [name, approvalThreshold]
      properties:
        name:
          type: string
          maxLength: 200
          # At least one character that isn't whitespace.
          pattern: '.*\S.*'
        approvalThreshold:
          $ref: '#/components/schemas/Money'
    Buyer:
      type: object
      required: [id, name, approvalThreshold]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        approvalThreshold:
          $ref: '#/components/schemas/Money'
    Credit:
      type: object
      description: >-
        A Buyer's Credit Line, and its Available Credit: the Credit Line minus open Holds and posted spend.
        Available Credit is negative when the Credit Line was lowered below the open Holds; a new Hold is placed only
        when Available Credit covers its amount.
      required: [creditLine, availableCredit]
      properties:
        creditLine:
          $ref: '#/components/schemas/Money'
        availableCredit:
          $ref: '#/components/schemas/SignedMoney'
    InvoiceSupplier:
      type: object
      description: The Supplier as an Invoice names it.
      required: [name, taxId, buyerReference, remittanceAddress]
      properties:
        name:
          type: string
          maxLength: 200
          pattern: '.*\S.*'
        taxId:
          type: string
          description: Identifies the Supplier across all Buyers; compared exactly.
          maxLength: 50
          pattern: '^\S+$'
        buyerReference:
          type: string
          description: The Buyer's own ID for the Supplier.
          maxLength: 100
          pattern: '.*\S.*'
        remittanceAddress:
          type: string
          description: The http(s) URL where the Supplier receives Remittance Advice.
          maxLength: 2000
          pattern: '^https?://\S+$'
    InvoiceRequest:
      type: object
      required: [supplier, invoiceNumber, amount, dueDate]
      properties:
        supplier:
          $ref: '#/components/schemas/InvoiceSupplier'
        invoiceNumber:
          type: string
          description: The Supplier's number for the Invoice.
          maxLength: 100
          pattern: '.*\S.*'
        amount:
          $ref: '#/components/schemas/Money'
        dueDate:
          type: string
          format: date
    Invoice:
      type: object
      required: [id, status, supplierId, supplier, invoiceNumber, amount, dueDate, decisions]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          description: >-
            `RECEIVED` until it is fully approved (`APPROVED`) or rejected (`REJECTED`); an Invoice above the
            Approval Threshold stays `RECEIVED` after its first approval.
          enum: [RECEIVED, APPROVED, REJECTED]
        supplierId:
          type: string
          format: uuid
        supplier:
          $ref: '#/components/schemas/InvoiceSupplier'
        invoiceNumber:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        dueDate:
          type: string
          format: date
        decisions:
          type: array
          description: Every approval and rejection of the Invoice, oldest first.
          items:
            $ref: '#/components/schemas/Decision'
        payment:
          $ref: '#/components/schemas/Payment'
    Payment:
      type: object
      description: >-
        The Payment an approved Invoice starts. Absent until then: it appears moments after the final approval.
      required: [state]
      properties:
        state:
          type: string
          description: >-
            `STARTED` until the Hold for the Invoice amount is placed (`HOLD_PLACED`), then `CARD_ISSUED` once the
            Single-Use Card is issued, then `COMPLETED` once the Supplier has received the Remittance Advice. `FAILED`
            when a step fails for good: the Invoice stays approved and unpaid, a card already issued is cancelled and a
            Hold already placed is released.
          enum: [STARTED, HOLD_PLACED, CARD_ISSUED, COMPLETED, FAILED]
        failureReason:
          type: string
          description: Why the Payment failed; present only when `state` is `FAILED`.
        card:
          $ref: '#/components/schemas/SingleUseCard'
    SingleUseCard:
      type: object
      description: >-
        The Single-Use Card issued to pay the Invoice, valid only for its Supplier and amount. Present once the card is
        issued. Shows only what identifies the card without revealing it: never the PAN or security code.
      required: [cardToken, lastFour, expiresAt]
      properties:
        cardToken:
          type: string
          description: The opaque Card Token that stands in for the card's PAN.
        lastFour:
          type: string
          description: The last four digits of the card's PAN.
          pattern: '^\d{4}$'
        expiresAt:
          type: string
          format: date-time
          description: When the card stops accepting Charges, 30 days after it was issued.
    RemittanceAdvice:
      type: object
      description: >-
        What the platform POSTs to a Supplier's `remittanceAddress` to pay one of its Invoices, with the advice's `id` in
        an `Idempotency-Key` header. Any 2xx answer acknowledges it. Delivery is at least once: a Supplier may receive
        the same advice again, under the same key and with the same link, and should keep only the first.
      required: [id, invoiceId, invoiceNumber, amount, cardLink, cardLinkExpiresAt]
      properties:
        id:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
          description: The Supplier's number for the Invoice.
        amount:
          $ref: '#/components/schemas/Money'
        cardLink:
          type: string
          format: uri
          description: >-
            Shows the Single-Use Card that pays the Invoice, once (`GET`, no sign-in). Anyone holding the link can open
            it, so keep it as secret as the card itself.
        cardLinkExpiresAt:
          type: string
          format: date-time
    SingleUseCardDetails:
      type: object
      description: >-
        What a Supplier needs to charge the Single-Use Card that pays its Invoice. Shown once, through the card link of
        the Remittance Advice.
      required: [pan, securityCode, expiresAt, amount, invoiceNumber]
      properties:
        pan:
          type: string
          description: The card's full number.
          pattern: '^\d{16}$'
        securityCode:
          type: string
          pattern: '^\d{3}$'
        expiresAt:
          type: string
          format: date-time
          description: When the card stops accepting Charges.
        amount:
          $ref: '#/components/schemas/Money'
        invoiceNumber:
          type: string
          description: The Supplier's number for the Invoice the card pays.
    Decision:
      type: object
      description: One Approver's approval or rejection of an Invoice.
      required: [decision, approverId, approverName, decidedAt]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        approverId:
          type: string
          description: The Approver's user ID at the identity provider (the token's subject).
        approverName:
          type: string
          description: The Approver's user name when they decided, for reading the record.
        decidedAt:
          type: string
          format: date-time
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
