openapi: 3.0.3
info:
  title: B2B Payments Platform API
  version: v1
  description: The Issuer's platform API. Terms follow GLOSSARY.md; errors are RFC 9457 problem details.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/breaks/{breakId}/resolution:
    post:
      tags: [Breaks]
      operationId: resolveBreak
      summary: Resolve a Break
      description: >-
        Reconcilers only (role `reconciler`); the Reconciler is the token's subject. Resolves an `OPEN` Break in one of
        three ways, with a note saying why: `ACCEPTED` moves no money; `REASSIGNED` posts a Correcting Entry that debits
        the named Buyer's Buyer Receivable and credits Clearing Suspense by the amount; `CORRECTED` posts a balanced
        Correcting Entry that debits one named Account and credits another by the amount. Nothing already in the books
        is changed. A missing or blank note, an amount of zero or less or in an unknown currency, the same Account on
        both sides, an unknown Buyer, or a field the kind needs left out is `422`. A Break already resolved answers
        `409`, so a repeat can't move money twice and there is no `Idempotency-Key`; an unknown Break answers `404`.
      parameters:
        - name: breakId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreakResolutionRequest'
      responses:
        '200':
          description: The Break, resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Break'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/buyers/{buyerId}:
    put:
      tags: [Buyers]
      operationId: putBuyer
      summary: Create a Buyer
      description: >-
        Issuer staff only (role `issuer-admin`). The caller chooses the Buyer ID, so the same ID can be
        provisioned into Buyer-side tokens ahead of time. Repeating the same request is safe; a different
        Buyer under an existing ID is a conflict.
      parameters:
        - name: buyerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerRequest'
      responses:
        '200':
          description: The same Buyer already existed; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Buyer'
        '201':
          description: The Buyer was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Buyer'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/buyers/{buyerId}/credit-line:
    put:
      tags: [Credit]
      operationId: putCreditLine
      summary: Set a Buyer's Credit Line
      description: >-
        Issuer staff only (role `issuer-admin`). Sets the most the Buyer may owe the Issuer at once,
        replacing any Credit Line it already has.
      parameters:
        - name: buyerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Money'
      responses:
        '200':
          description: The Buyer's Credit Line was replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Money'
        '201':
          description: The Buyer had no Credit Line; now it has this one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Money'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/buyers/{buyerId}/credit:
    get:
      tags: [Credit]
      operationId: getCredit
      summary: Read a Buyer's Credit Line, open Holds, Buyer Receivable and Available Credit
      description: >-
        Issuer staff only (role `issuer-admin`). A Buyer whose Credit Line was never set answers `404`,
        like an unknown Buyer.
      parameters:
        - name: buyerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The Buyer's Credit Line, open Holds, Buyer Receivable and Available Credit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credit'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/buyers/{buyerId}/repayments:
    post:
      tags: [Credit]
      operationId: recordRepayment
      summary: Record a Buyer's Repayment
      description: >-
        Issuer staff only (role `issuer-admin`). Records money the Buyer paid the Issuer: it debits Issuer Cash and
        credits the Buyer Receivable, so Available Credit rises by the amount. An amount of zero or less, in another
        currency than the Credit Line's, or above the Buyer Receivable (what the Buyer owes for cleared Charges) is
        `422`. A Buyer whose Credit Line was never set answers `404`, like an unknown Buyer. Repeating a request with
        the same `Idempotency-Key` returns the original response and posts nothing; reusing a key with a different
        request (another Buyer or amount) is `422`.
      parameters:
        - name: buyerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: A new random value per Repayment, such as a UUID; resend the same value when retrying.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepaymentRequest'
      responses:
        '201':
          description: The Repayment was posted, or this is the replay of an earlier response to the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repayment'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/invoices:
    post:
      tags: [Invoices]
      operationId: submitInvoice
      summary: Submit an Invoice
      description: >-
        A Buyer's ERP only (role `erp`); the Buyer is the one in the token's `buyer_id` claim. The amount must
        be more than zero. The first Invoice naming an unknown tax ID creates the Supplier, and the Buyer's first
        Invoice to a Supplier creates its Supplier Relationship; later Invoices reuse both and don't change them,
        except that a Supplier without an Acceptor ID takes the first one an Invoice carries. Repeating a request
        with the same `Idempotency-Key` returns the original response; reusing a key with a different request is
        `422`. The same Supplier and Invoice number under a new key is `409`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A new random value per Invoice, such as a UUID; resend the same value when retrying.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      responses:
        '201':
          description: The Invoice was received, or this is the replay of an earlier response to the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoiceId}:
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Get an Invoice
      description: >-
        Buyer-side roles (`erp`, `approver`). An Invoice of any other Buyer answers `404`, as if it didn't exist.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The Invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoiceId}/approval:
    post:
      tags: [Invoices]
      operationId: approveInvoice
      summary: Approve an Invoice
      description: >-
        An Approver of the Invoice's Buyer only (role `approver`); the Approver is the token's subject. An Invoice at
        or under the Buyer's Approval Threshold is approved by one Approver; above it, by two different Approvers.
        The same Approver approving again changes nothing and returns the Invoice, so retrying is safe. A rejected
        Invoice, or one other Approvers have already fully approved, is `409`. An Invoice of any other Buyer
        answers `404`.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The Invoice, with this approval recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoiceId}/rejection:
    post:
      tags: [Invoices]
      operationId: rejectInvoice
      summary: Reject an Invoice
      description: >-
        An Approver of the Invoice's Buyer only (role `approver`); the Approver is the token's subject. An Approver
        may reject an Invoice they approved while it still awaits a second approval. A rejection is final: any later
        approval or rejection, the same Approver's included, is `409`. An approved Invoice can't be rejected
        (`409`). An Invoice of any other Buyer answers `404`.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The Invoice, rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/clearing-files:
    get:
      tags: [ClearingFiles]
      operationId: listClearingFiles
      summary: List the Clearing Files the platform received, newest first
      description: >-
        Issuer staff only (role `issuer-admin`). Every Clearing File the platform received, newest first by when it
        received them, a page at a time: pass a page's `nextCursor` as `cursor` for the next page. Every page also
        shows the gaps in the Network's sequence numbers (`missingSequenceNumbers`), so a file that never arrived
        stands out. A refused file is listed too, with why it was refused. A `limit` outside 1 to 100, or a `cursor`
        that can't be read, is `400`.
      parameters:
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the page before; leave it out for the first page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: The most files on a page, from 1 to 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of Clearing Files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearingFileList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [ClearingFiles]
      operationId: importClearingFile
      summary: Import a Clearing File from the drop folder now
      description: >-
        Issuer staff only (role `issuer-admin`). Imports the named file from the platform's drop folder at once,
        instead of waiting for the next check of the folder (every 30 seconds), and answers when the import is done.
        Every Clearing is posted to the journal and recorded with how it matched its card's Authorization (the
        summary counts each outcome); its card becomes `CLEARED`, and so does the card's Hold if it is still open. A
        record whose Network record ID was already imported is skipped and counted. Then the file is settled at its
        trailer's net settlement amount, and deleted. The file's ID and content make a repeat harmless, so there is no
        `Idempotency-Key`: a file whose ID or content an imported file already had answers `409`, naming that file. A
        file that fails a check (its layout, its trailer's record count, amount total or currency) answers `422` with
        the check, and nothing in it is posted; either file moves to the drop folder's `failed/` folder. An import that
        stopped partway keeps what it committed and answers `500`; importing the same file name again restarts it where
        it stopped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearingFileImport'
      responses:
        '201':
          description: The file was imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearingFile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/clearing-files/{fileId}:
    get:
      tags: [ClearingFiles]
      operationId: getClearingFile
      summary: Get a Clearing File
      description: >-
        Issuer staff only (role `issuer-admin`). The file's summary, as its import answered it, now: its status, its
        Clearings counted by outcome and its Settlement.
      parameters:
        - name: fileId
          in: path
          required: true
          description: The Network's ID for the file, from its header.
          schema:
            type: string
      responses:
        '200':
          description: The Clearing File.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearingFile'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/reconciliation-runs:
    post:
      tags: [ReconciliationRuns]
      operationId: runReconciliation
      summary: Run a Reconciliation for a Business Date now
      description: >-
        Issuer staff only (role `issuer-admin`). Reconciles the Business Date at once, instead of waiting for the daily
        run just after midnight UTC, and answers when the run is done. Every Clearing of that day whose outcome isn't
        matched raises a Break of that outcome's kind, and so does every matched Clearing below its authorized amount
        (an Undercharge). Each Break has a natural key, its kind and the record it names, so a run that finds a Break
        raised before counts it as known instead of raising it again: a repeat is harmless, so there is no
        `Idempotency-Key`. A run that fails keeps the Breaks it raised and answers `500`; running it again finds them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationRunRequest'
      responses:
        '201':
          description: The run is done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationRun'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/remittance-links/{token}:
    get:
      tags: [RemittanceLinks]
      operationId: openRemittanceLink
      summary: Open the card link of a Remittance Advice
      description: >-
        No sign-in: the token, sent to the Supplier in its Remittance Advice (`cardLink`), is the credential. The first
        open answers with the Single-Use Card's details and uses the link up. A later open, an open after the link
        expired (7 days after the Remittance Advice was created) or after the card was cancelled answers `410`; a token
        that matches no link answers `404`.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The card's details, shown this once.
          headers:
            Cache-Control:
              description: Always `no-store`, so no cache keeps the card's details.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleUseCardDetails'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: object
      description: An amount in integer minor units (cents for USD) with its currency.
      required: [minorUnits, currency]
      properties:
        minorUnits:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [USD]
    SignedMoney:
      type: object
      description: >-
        Like Money, but the amount may be negative, as Available Credit is when Issuer staff lower a Credit Line
        below the Buyer's open Holds.
      required: [minorUnits, currency]
      properties:
        minorUnits:
          type: integer
          format: int64
        currency:
          type: string
          enum: [USD]
    BuyerRequest:
      type: object
      required: [name, approvalThreshold]
      properties:
        name:
          type: string
          maxLength: 200
          # At least one character that isn't whitespace.
          pattern: '.*\S.*'
        approvalThreshold:
          $ref: '#/components/schemas/Money'
    Buyer:
      type: object
      required: [id, name, approvalThreshold]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        approvalThreshold:
          $ref: '#/components/schemas/Money'
    Credit:
      type: object
      description: >-
        A Buyer's Credit Line, and its Available Credit: the Credit Line minus the Buyer Receivable (what the Buyer
        owes for cleared Charges) and minus open Holds. Available Credit is negative when the Credit Line was lowered
        below what is owed and held; a new Hold is placed only when Available Credit covers its amount.
      required: [creditLine, openHolds, buyerReceivable, availableCredit]
      properties:
        creditLine:
          $ref: '#/components/schemas/Money'
        openHolds:
          $ref: '#/components/schemas/Money'
        buyerReceivable:
          $ref: '#/components/schemas/Money'
        availableCredit:
          $ref: '#/components/schemas/SignedMoney'
    RepaymentRequest:
      type: object
      description: >-
        The amount the Buyer repaid, in integer minor units with its currency. Unlike Money it takes any whole number
        and any three-letter code, so an amount of zero or less, or in another currency than the Credit Line's, is
        refused with `422` like an amount above the Buyer Receivable.
      required: [minorUnits, currency]
      properties:
        minorUnits:
          type: integer
          format: int64
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    Repayment:
      type: object
      description: A Buyer's payment to the Issuer that reduced its Buyer Receivable, as the journal posted it.
      required: [id, amount, postedAt]
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the Repayment's Journal Entry.
        amount:
          $ref: '#/components/schemas/Money'
        postedAt:
          type: string
          format: date-time
    InvoiceSupplier:
      type: object
      description: The Supplier as an Invoice names it.
      required: [name, taxId, buyerReference, remittanceAddress]
      properties:
        name:
          type: string
          maxLength: 200
          pattern: '.*\S.*'
        taxId:
          type: string
          description: Identifies the Supplier across all Buyers; compared exactly.
          maxLength: 50
          pattern: '^\S+$'
        buyerReference:
          type: string
          description: The Buyer's own ID for the Supplier.
          maxLength: 100
          pattern: '.*\S.*'
        remittanceAddress:
          type: string
          description: The http(s) URL where the Supplier receives Remittance Advice.
          maxLength: 2000
          pattern: '^https?://\S+$'
        acceptorId:
          type: string
          description: >-
            The Acceptor ID the Supplier's Acquirer gave it (ISO 8583 DE 42), which the Network carries on every
            Charge from the Supplier; compared exactly. Optional, but a Single-Use Card whose Supplier has no Acceptor
            ID declines every Charge. The first Invoice that carries one sets it for the Supplier; a different one on
            a later Invoice is ignored.
          minLength: 1
          maxLength: 15
          pattern: '.*\S.*'
    InvoiceRequest:
      type: object
      required: [supplier, invoiceNumber, amount, dueDate]
      properties:
        supplier:
          $ref: '#/components/schemas/InvoiceSupplier'
        invoiceNumber:
          type: string
          description: The Supplier's number for the Invoice.
          maxLength: 100
          pattern: '.*\S.*'
        amount:
          $ref: '#/components/schemas/Money'
        dueDate:
          type: string
          format: date
    Invoice:
      type: object
      required: [id, status, supplierId, supplier, invoiceNumber, amount, dueDate, decisions]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          description: >-
            `RECEIVED` until it is fully approved (`APPROVED`) or rejected (`REJECTED`); an Invoice above the
            Approval Threshold stays `RECEIVED` after its first approval.
          enum: [RECEIVED, APPROVED, REJECTED]
        supplierId:
          type: string
          format: uuid
        supplier:
          $ref: '#/components/schemas/InvoiceSupplier'
        invoiceNumber:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        dueDate:
          type: string
          format: date
        decisions:
          type: array
          description: Every approval and rejection of the Invoice, oldest first.
          items:
            $ref: '#/components/schemas/Decision'
        payment:
          $ref: '#/components/schemas/Payment'
    Payment:
      type: object
      description: >-
        The Payment an approved Invoice starts. Absent until then: it appears moments after the final approval.
      required: [state]
      properties:
        state:
          type: string
          description: >-
            `STARTED` until the Hold for the Invoice amount is placed (`HOLD_PLACED`), then `CARD_ISSUED` once the
            Single-Use Card is issued, then `COMPLETED` once the Supplier has received the Remittance Advice. `FAILED`
            when a step fails for good: the Invoice stays approved and unpaid, a card already issued is cancelled and a
            Hold already placed is released. `EXPIRED` when nobody charged the card before its expiry: its Hold is
            released and the Invoice stays approved and unpaid.
          enum: [STARTED, HOLD_PLACED, CARD_ISSUED, COMPLETED, FAILED, EXPIRED]
        failureReason:
          type: string
          description: Why the Payment failed; present only when `state` is `FAILED`.
        card:
          $ref: '#/components/schemas/SingleUseCard'
    SingleUseCard:
      type: object
      description: >-
        The Single-Use Card issued to pay the Invoice, valid only for its Supplier and amount. Present once the card is
        issued. Shows only what identifies the card without revealing it: never the PAN or security code.
      required: [cardToken, lastFour, expiresAt]
      properties:
        cardToken:
          type: string
          description: The opaque Card Token that stands in for the card's PAN.
        lastFour:
          type: string
          description: The last four digits of the card's PAN.
          pattern: '^\d{4}$'
        expiresAt:
          type: string
          format: date-time
          description: When the card stops accepting Charges, 30 days after it was issued.
    RemittanceAdvice:
      type: object
      description: >-
        What the platform POSTs to a Supplier's `remittanceAddress` to pay one of its Invoices, with the advice's `id` in
        an `Idempotency-Key` header. Any 2xx answer acknowledges it. Delivery is at least once: a Supplier may receive
        the same advice again, under the same key and with the same link, and should keep only the first.
      required: [id, invoiceId, invoiceNumber, amount, cardLink, cardLinkExpiresAt]
      properties:
        id:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
          description: The Supplier's number for the Invoice.
        amount:
          $ref: '#/components/schemas/Money'
        cardLink:
          type: string
          format: uri
          description: >-
            Shows the Single-Use Card that pays the Invoice, once (`GET`, no sign-in). Anyone holding the link can open
            it, so keep it as secret as the card itself.
        cardLinkExpiresAt:
          type: string
          format: date-time
    SingleUseCardDetails:
      type: object
      description: >-
        What a Supplier needs to charge the Single-Use Card that pays its Invoice. Shown once, through the card link of
        the Remittance Advice.
      required: [pan, securityCode, expiresAt, amount, invoiceNumber]
      properties:
        pan:
          type: string
          description: The card's full number.
          pattern: '^\d{16}$'
        securityCode:
          type: string
          pattern: '^\d{3}$'
        expiresAt:
          type: string
          format: date-time
          description: When the card stops accepting Charges.
        amount:
          $ref: '#/components/schemas/Money'
        invoiceNumber:
          type: string
          description: The Supplier's number for the Invoice the card pays.
    ClearingFileImport:
      type: object
      required: [fileName]
      properties:
        fileName:
          type: string
          description: >-
            The file's name in the platform's drop folder, or in its `processing/` folder when an import of it
            stopped partway. A name only, no path.
          maxLength: 255
          pattern: '^[A-Za-z0-9_-][A-Za-z0-9._-]*$'
    ClearingFile:
      type: object
      description: A Clearing File the platform received, as its header and its Clearings describe it.
      required: [id, sequenceNumber, businessDate, status, skippedCount, outcomes]
      properties:
        id:
          type: string
          description: The Network's ID for the file, from its header.
        sequenceNumber:
          type: integer
          format: int64
          description: The Network's count of files sent to the Issuer, from its header.
        businessDate:
          type: string
          format: date
          description: The day the file covers, by the Network's calendar in UTC.
        status:
          type: string
          description: >-
            `IMPORTING` while its Clearings are being posted, or when an import of it stopped partway (importing it
            again restarts it); `IMPORTED` once every Clearing in it is recorded; `REFUSED` when it failed a check
            (its layout, its trailer's record count, amount total or currency) and nothing in it was posted; a
            corrected file sent under its ID replaces it. Only the list and the detail show a `REFUSED` file: its
            import answered `422`.
          enum: [IMPORTING, IMPORTED, REFUSED]
        refusalReason:
          type: string
          description: >-
            Which check refused the file, by line and field, never a value; present only when `status` is `REFUSED`.
            See `docs/runbooks/clearing-file-refused.md`.
          # Left out of the JSON rather than null, so every other file's summary stays as it was.
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        recordCount:
          type: integer
          format: int64
          description: >-
            The number of Clearings in the file; null for a `REFUSED` file, whose records may not all have been read.
        skippedCount:
          type: integer
          format: int64
          description: >-
            How many of them were skipped, and not posted, because their Network record ID was already imported,
            earlier in the file or in another file.
        outcomes:
          $ref: '#/components/schemas/ClearingOutcomeCounts'
        settlement:
          $ref: '#/components/schemas/Settlement'
    ClearingFileList:
      type: object
      description: >-
        A page of the Clearing Files the platform received, newest first, and the gaps in the Network's sequence
        numbers.
      required: [items, missingSequenceNumbers]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClearingFile'
        nextCursor:
          type: string
          description: Pass it as `cursor` for the next page; absent on the last page.
          # Left out of the JSON rather than null, so "absent" holds: the generator puts this on the field.
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        missingSequenceNumbers:
          type: array
          description: >-
            The Network's sequence numbers, between the lowest and the highest of the imported files', that no
            imported file has, lowest first: the first 100 only. A file the Network sent that never arrived, was
            refused, or isn't imported yet: see `docs/runbooks/clearing-file-missing.md`. The same on every page.
          items:
            type: integer
            format: int64
    ClearingOutcomeCounts:
      type: object
      description: >-
        How many of the file's recorded Clearings ended with each outcome: how each matched its card's Authorization.
        Every one is posted; Reconciliation (M4) turns every outcome but `matched` into a Break.
      required:
        - matched
        - aboveAuthorizedAmount
        - noAuthorization
        - unknownCard
        - otherCurrency
        - againstReversedAuthorization
        - afterHoldExpired
        - authorizationAlreadyCleared
      properties:
        matched:
          type: integer
          format: int64
          description: At or below its approved Authorization's amount; both amounts are kept.
        aboveAuthorizedAmount:
          type: integer
          format: int64
          description: Above its approved Authorization's amount; the full cleared amount is posted.
        noAuthorization:
          type: integer
          format: int64
          description: Its card has no Authorization with its authorization code; posted to the card's Buyer.
        unknownCard:
          type: integer
          format: int64
          description: The Issuer knows no card with its PAN; posted to Clearing Suspense.
        otherCurrency:
          type: integer
          format: int64
          description: In another currency than its card's; posted to Clearing Suspense.
        againstReversedAuthorization:
          type: integer
          format: int64
          description: Its Authorization was reversed.
        afterHoldExpired:
          type: integer
          format: int64
          description: Its card's Hold was already released, when the card expired.
        authorizationAlreadyCleared:
          type: integer
          format: int64
          description: Another Clearing already cleared its Authorization.
    Settlement:
      type: object
      description: >-
        The file's Settlement: the Issuer pays the Network the file's net settlement amount (`amount`, the Network's
        figure from the file's trailer), whatever the platform imported (`importedTotal`, the total of the file's posted
        Clearings). Present once the file is settled, which an imported file always is. When the two differ the
        Settlement isn't `matched`, and the Network Settlement Payable keeps the gap until M4's Reconciliation resolves
        it: see `docs/runbooks/settlement-mismatched.md`.
      required: [amount, importedTotal, matched]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        importedTotal:
          $ref: '#/components/schemas/Money'
        matched:
          type: boolean
    ReconciliationRunRequest:
      type: object
      required: [businessDate]
      properties:
        businessDate:
          type: string
          format: date
          description: The Business Date to reconcile, by the Network's calendar in UTC.
    ReconciliationRun:
      type: object
      description: What a Reconciliation run found.
      required: [runId, businessDate, breaksFound, newBreaks, knownBreaks]
      properties:
        runId:
          type: string
          format: uuid
          description: The run's ID, as the platform's log names it.
        businessDate:
          type: string
          format: date
        breaksFound:
          type: integer
          format: int64
          description: Every Break the run found, new or known.
        newBreaks:
          type: integer
          format: int64
          description: The Breaks this run raised.
        knownBreaks:
          type: integer
          format: int64
          description: The Breaks an earlier run had raised already.
    BreakResolutionRequest:
      type: object
      description: >-
        How a Reconciler resolves a Break. `note` is required for every kind; `REASSIGNED` also needs `buyerId` and
        `amount`, and `CORRECTED` needs `debitAccount`, `creditAccount` and `amount`. Only `kind` is checked by the
        schema; the rest is refused with `422`.
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/ResolutionKind'
        note:
          type: string
          description: Why the Break is resolved this way.
        buyerId:
          type: string
          format: uuid
          description: For `REASSIGNED`, the Buyer whose Buyer Receivable is debited.
        debitAccount:
          $ref: '#/components/schemas/LedgerAccount'
        creditAccount:
          $ref: '#/components/schemas/LedgerAccount'
        amount:
          $ref: '#/components/schemas/Amount'
    ResolutionKind:
      type: string
      enum: [ACCEPTED, REASSIGNED, CORRECTED]
    LedgerAccount:
      type: object
      description: An Account in the Issuer's books, by kind; a Buyer Receivable also names its Buyer.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [BUYER_RECEIVABLE, NETWORK_SETTLEMENT_PAYABLE, ISSUER_CASH, CLEARING_SUSPENSE]
        buyerId:
          type: string
          format: uuid
    Amount:
      type: object
      description: >-
        An amount in integer minor units with its currency. Unlike Money it takes any whole number and any three-letter
        code, so a Break in another currency can be shown, and a bad amount is refused with `422`.
      required: [minorUnits, currency]
      properties:
        minorUnits:
          type: integer
          format: int64
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    Break:
      type: object
      description: What Reconciliation could not match, `OPEN` until a Reconciler resolves it.
      required: [id, kind, recordId, status, businessDate, gap]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [ABOVE_AUTHORIZED_AMOUNT, NO_AUTHORIZATION, UNKNOWN_CARD, OTHER_CURRENCY,
                 AGAINST_REVERSED_AUTHORIZATION, AFTER_HOLD_EXPIRED, AUTHORIZATION_ALREADY_CLEARED, UNDERCHARGE]
        recordId:
          type: string
          description: The ID of the record the Break names, of the type its kind says (a Clearing's Network record ID).
        status:
          type: string
          enum: [OPEN, RESOLVED]
        businessDate:
          type: string
          format: date
          description: The Business Date of the run that raised it.
        buyerId:
          type: string
          format: uuid
          description: The Buyer it concerns; null when none is known.
        gap:
          $ref: '#/components/schemas/Amount'
        resolution:
          $ref: '#/components/schemas/BreakResolution'
    BreakResolution:
      type: object
      description: How and by whom a Break was resolved; present once it is `RESOLVED`.
      required: [kind, note, resolvedBy, resolvedByName, resolvedAt]
      properties:
        kind:
          $ref: '#/components/schemas/ResolutionKind'
        note:
          type: string
        resolvedBy:
          type: string
          description: The Reconciler's user ID at the identity provider (the token's subject).
        resolvedByName:
          type: string
          description: The Reconciler's user name when they resolved it, for reading the record.
        resolvedAt:
          type: string
          format: date-time
        correctingEntryId:
          type: string
          format: uuid
          description: The Correcting Entry's Journal Entry ID; null for `ACCEPTED`.
    Decision:
      type: object
      description: One Approver's approval or rejection of an Invoice.
      required: [decision, approverId, approverName, decidedAt]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        approverId:
          type: string
          description: The Approver's user ID at the identity provider (the token's subject).
        approverName:
          type: string
          description: The Approver's user name when they decided, for reading the record.
        decidedAt:
          type: string
          format: date-time
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
