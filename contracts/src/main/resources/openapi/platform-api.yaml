openapi: 3.0.3
info:
  title: B2B Payments Platform API
  version: v1
  description: The Issuer's platform API. Terms follow GLOSSARY.md; errors are RFC 9457 problem details.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/buyers/{buyerId}:
    put:
      tags: [Buyers]
      operationId: putBuyer
      summary: Create a Buyer
      description: >-
        Issuer staff only (role `issuer-admin`). The caller chooses the Buyer ID, so the same ID can be
        provisioned into Buyer-side tokens ahead of time. Repeating the same request is safe; a different
        Buyer under an existing ID is a conflict.
      parameters:
        - name: buyerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerRequest'
      responses:
        '200':
          description: The same Buyer already existed; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Buyer'
        '201':
          description: The Buyer was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Buyer'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/invoices:
    post:
      tags: [Invoices]
      operationId: submitInvoice
      summary: Submit an Invoice
      description: >-
        A Buyer's ERP only (role `erp`); the Buyer is the one in the token's `buyer_id` claim. The amount must
        be more than zero. The first Invoice naming an unknown tax ID creates the Supplier, and the Buyer's first
        Invoice to a Supplier creates its Supplier Relationship; later Invoices reuse both and don't change them.
        Repeating a request with the same `Idempotency-Key` returns the original response; reusing a key with a
        different request is `422`. The same Supplier and Invoice number under a new key is `409`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A new random value per Invoice, such as a UUID; resend the same value when retrying.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      responses:
        '201':
          description: The Invoice was received, or this is the replay of an earlier response to the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/invoices/{invoiceId}:
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Get an Invoice
      description: >-
        Buyer-side roles (`erp`, `approver`). An Invoice of any other Buyer answers `404`, as if it didn't exist.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The Invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: object
      description: An amount in integer minor units (cents for USD) with its currency.
      required: [minorUnits, currency]
      properties:
        minorUnits:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [USD]
    BuyerRequest:
      type: object
      required: [name, approvalThreshold]
      properties:
        name:
          type: string
          maxLength: 200
          # At least one character that isn't whitespace.
          pattern: '.*\S.*'
        approvalThreshold:
          $ref: '#/components/schemas/Money'
    Buyer:
      type: object
      required: [id, name, approvalThreshold]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        approvalThreshold:
          $ref: '#/components/schemas/Money'
    InvoiceSupplier:
      type: object
      description: The Supplier as an Invoice names it.
      required: [name, taxId, buyerReference, remittanceAddress]
      properties:
        name:
          type: string
          maxLength: 200
          pattern: '.*\S.*'
        taxId:
          type: string
          description: Identifies the Supplier across all Buyers; compared exactly.
          maxLength: 50
          pattern: '^\S+$'
        buyerReference:
          type: string
          description: The Buyer's own ID for the Supplier.
          maxLength: 100
          pattern: '.*\S.*'
        remittanceAddress:
          type: string
          description: The http(s) URL where the Supplier receives Remittance Advice.
          maxLength: 2000
          pattern: '^https?://\S+$'
    InvoiceRequest:
      type: object
      required: [supplier, invoiceNumber, amount, dueDate]
      properties:
        supplier:
          $ref: '#/components/schemas/InvoiceSupplier'
        invoiceNumber:
          type: string
          description: The Supplier's number for the Invoice.
          maxLength: 100
          pattern: '.*\S.*'
        amount:
          $ref: '#/components/schemas/Money'
        dueDate:
          type: string
          format: date
    Invoice:
      type: object
      required: [id, status, supplierId, supplier, invoiceNumber, amount, dueDate]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [RECEIVED]
        supplierId:
          type: string
          format: uuid
        supplier:
          $ref: '#/components/schemas/InvoiceSupplier'
        invoiceNumber:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        dueDate:
          type: string
          format: date
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
