spring.application.name=gateway

# The platform has 8080, the simulator 8081 and authorization-service 8082.
server.port=8083

# Where the platform's REST API answers. The cluster sets GATEWAY_PLATFORM_URI to the platform's Service.
gateway.platform-uri=http://localhost:8080

# Every /v1 path goes to the platform as it came, Authorization header included. The platform's gRPC skips the Gateway
# (M6 design, Traffic). The remittance link has a route of its own, listed first so it matches first: it has no token,
# so it can't be limited by client.
spring.cloud.gateway.server.webflux.routes[0].id=remittance-link
spring.cloud.gateway.server.webflux.routes[0].uri=${gateway.platform-uri}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/v1/remittance-links/*
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=GET

spring.cloud.gateway.server.webflux.routes[1].id=platform
spring.cloud.gateway.server.webflux.routes[1].uri=${gateway.platform-uri}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/v1/**
# Each Keycloak client (RateLimits.keycloakClient) gets bursts to 40 and 20 requests a second after that, in a token
# bucket in Redis (M6 design, Rate limiting). Over the limit the filter throws, so GatewayProblems answers a 429 with
# Retry-After as Problem Details instead of the filter's empty 429.
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.throwOnLimit=true

# The same Keycloak realm as the platform: a request without a valid token stops here (SecurityConfig). Roles are left
# to the platform. Where the token's issuer isn't reachable (the cluster),
# SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI names the keys' address instead: Spring Boot's reactive decoder
# then fetches the keys from it and still checks iss against issuer-uri, so the Gateway needs no decoder of its own.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/payments
