spring.application.name=simulator
server.port=8081

# Both apps share one stack: start it if it isn't running, and leave it running on shutdown.
# The path is relative to the module directory, where spring-boot:run starts the app.
spring.docker.compose.file=../compose.yaml
spring.docker.compose.lifecycle-management=start-only
# Compose support also supplies otel-lgtm's OTLP endpoints. It is left out of the executable jar, so where the jar runs
# without it (the cluster) they come from MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT,
# MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT and MANAGEMENT_OTLP_METRICS_EXPORT_URL. Every other address here is
# a property, set the same way by its environment variable (SIMULATOR_PLATFORM_GRPC_ADDRESS for the Network's).

management.tracing.sampling.probability=1.0

# Development secrets, written by scripts/init-env.sh.
spring.config.import=optional:file:../.env[.properties]

simulator.platform-url=http://localhost:8080
# Where the Network reaches the platform's gRPC server (the Network link), in plaintext until mutual TLS in M7.
simulator.platform-grpc-address=localhost:9090
spring.grpc.client.channel.platform.target=static://${simulator.platform-grpc-address}
# How long the Network waits for the platform's answer to an Authorization before it declines the Charge itself (91)
# and reverses it (ADR-0010). Each Reversal attempt gets the same deadline.
simulator.network.authorization-deadline=1s
# The Issuer's drop folder, where the Network writes its Clearing Files: the platform's own default (clearing.drop-folder),
# var/clearing at the repository root, which git ignores. Relative to the module directory, like the platform's.
simulator.network.drop-folder=../var/clearing
# When the Network writes the file for the Business Date that just ended: 00:05 UTC every day (a Spring cron: second,
# minute, hour, day of month, month, day of week; - turns it off, as the tests do). POST /demo/clearing-file writes one
# at once.
simulator.network.clearing-file-cron=0 5 0 * * *
# Where POST /demo/load-test-cards writes the cards Globex received, for the load test to charge: under var/ at the
# repository root, which git ignores, as the file holds PANs. Each run overwrites it, unless called with append=true.
simulator.load-test.cards-file=../var/load-test/cards.csv
simulator.seed.enabled=true
# Acme's Buyer ID is fixed, so Acme's Buyer-side clients in Keycloak can carry it in their tokens.
simulator.acme.buyer-id=dc9a9857-e40f-4d50-9ee3-879f0c7472c5
# Initech, the load test's Buyer, likewise; POST /demo/load-test-cards pays its Invoices to Globex.
simulator.initech.buyer-id=13542409-3211-4b3d-8ba0-3762801cffcd
# The Acceptor ID Globex's Acquirer gave it (ISO 8583 DE 42, up to 15 characters), made up. Acme's ERP names it on
# its Invoices, and the platform declines any Charge on Globex's cards that doesn't carry it.
simulator.globex.acceptor-id=GLOBEX000000001

spring.security.oauth2.client.registration.issuer-admin.provider=keycloak
spring.security.oauth2.client.registration.issuer-admin.client-id=simulator-issuer-admin
spring.security.oauth2.client.registration.issuer-admin.client-secret=${SIMULATOR_ISSUER_ADMIN_SECRET:}
spring.security.oauth2.client.registration.issuer-admin.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.acme-erp.provider=keycloak
spring.security.oauth2.client.registration.acme-erp.client-id=acme-erp
spring.security.oauth2.client.registration.acme-erp.client-secret=${ACME_ERP_SECRET:}
spring.security.oauth2.client.registration.acme-erp.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.acme-approver-1.provider=keycloak
spring.security.oauth2.client.registration.acme-approver-1.client-id=acme-approver-1
spring.security.oauth2.client.registration.acme-approver-1.client-secret=${ACME_APPROVER_1_SECRET:}
spring.security.oauth2.client.registration.acme-approver-1.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.acme-approver-2.provider=keycloak
spring.security.oauth2.client.registration.acme-approver-2.client-id=acme-approver-2
spring.security.oauth2.client.registration.acme-approver-2.client-secret=${ACME_APPROVER_2_SECRET:}
spring.security.oauth2.client.registration.acme-approver-2.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.initech-erp.provider=keycloak
spring.security.oauth2.client.registration.initech-erp.client-id=initech-erp
spring.security.oauth2.client.registration.initech-erp.client-secret=${INITECH_ERP_SECRET:}
spring.security.oauth2.client.registration.initech-erp.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.initech-approver.provider=keycloak
spring.security.oauth2.client.registration.initech-approver.client-id=initech-approver
spring.security.oauth2.client.registration.initech-approver.client-secret=${INITECH_APPROVER_SECRET:}
spring.security.oauth2.client.registration.initech-approver.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.network.provider=keycloak
spring.security.oauth2.client.registration.network.client-id=network
spring.security.oauth2.client.registration.network.client-secret=${NETWORK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.network.authorization-grant-type=client_credentials
# A token URI instead of an issuer URI, so the simulator starts without asking Keycloak anything.
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8180/realms/payments/protocol/openid-connect/token
