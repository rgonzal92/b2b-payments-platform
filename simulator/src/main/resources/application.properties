spring.application.name=simulator
server.port=8081

# Both apps share one stack: start it if it isn't running, and leave it running on shutdown.
# The path is relative to the module directory, where spring-boot:run starts the app.
spring.docker.compose.file=../compose.yaml
spring.docker.compose.lifecycle-management=start-only

management.tracing.sampling.probability=1.0

# Development secrets, written by scripts/init-env.sh.
spring.config.import=optional:file:../.env[.properties]

simulator.platform-url=http://localhost:8080
simulator.seed.enabled=true
# Acme's Buyer ID is fixed, so Acme's Buyer-side clients in Keycloak can carry it in their tokens.
simulator.acme.buyer-id=dc9a9857-e40f-4d50-9ee3-879f0c7472c5

spring.security.oauth2.client.registration.issuer-admin.provider=keycloak
spring.security.oauth2.client.registration.issuer-admin.client-id=simulator-issuer-admin
spring.security.oauth2.client.registration.issuer-admin.client-secret=${SIMULATOR_ISSUER_ADMIN_SECRET:}
spring.security.oauth2.client.registration.issuer-admin.authorization-grant-type=client_credentials
# A token URI instead of an issuer URI, so the simulator starts without asking Keycloak anything.
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8180/realms/payments/protocol/openid-connect/token
