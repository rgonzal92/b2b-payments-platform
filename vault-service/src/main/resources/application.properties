spring.application.name=vault-service

# Development secrets, written by scripts/init-env.sh.
spring.config.import=optional:file:../.env[.properties]

# Each HTTP request and each gRPC call (GrpcCallThreads) runs on a virtual thread of its own, so a call waiting on
# OpenBao or the database holds no platform thread.
spring.threads.virtual.enabled=true

# The platform has 8080, the simulator 8081, authorization-service 8082 and the Gateway 8083.
server.port=8084

# IssueCard: Spring gRPC's Netty server beside Tomcat, on this machine only, plaintext and unauthenticated until mutual
# TLS (#142); authorization-service has 9090. SPRING_GRPC_SERVER_ADDRESS and SPRING_GRPC_SERVER_PORT override them.
spring.grpc.server.address=127.0.0.1
spring.grpc.server.port=9091

# The cards' hash key (ADR-0004, design Q9): the PAN's and security code's keyed hashes must equal
# authorization-service's, so for now CARD_HASH_KEY has the same value as the platform's VAULT_HASH_KEY. Its own
# environment gives it; the service refuses to start without it and never logs it.
card.hash-key=${CARD_HASH_KEY:}

# OpenBao Transit (docs/learning/openbao.md): each card's data key comes from it, wrapped by the key-encryption key
# card-kek, which never leaves OpenBao. The token's policy allows only datakey, decrypt and rewrap on that key
# (openbao/dev-init.hcl). OPENBAO_ADDRESS overrides the address.
openbao.address=${OPENBAO_ADDRESS:http://localhost:8200}
openbao.token=${OPENBAO_TOKEN:}
# A call to OpenBao fails within seconds rather than holding the caller's deadline.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

# The service's own PostgreSQL, vault-postgres in compose.yaml: docker compose up -d starts it. SPRING_DATASOURCE_URL
# overrides the address.
spring.datasource.url=jdbc:postgresql://localhost:5434/vault
spring.datasource.username=vault

# Metrics, traces and logs go to otel-lgtm over OTLP, under service.name vault-service, as authorization-service sends
# them. MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT, MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT and
# MANAGEMENT_OTLP_METRICS_EXPORT_URL override the endpoints.
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.tracing.sampling.probability=1.0
